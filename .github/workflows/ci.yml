name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Dummy values sufficient for `prisma generate` (schema parsing only, no
  # live connection needed) and config validation — real infra isn't
  # provisioned in this workflow. E2E specs that need a live Postgres/Redis
  # are intentionally not run here yet; see apps/api/test/.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-real-32chars
  JWT_REFRESH_SECRET: ci-only-refresh-secret-not-used-anywhere-real-32c
  COOKIE_SECRET: ci-only-cookie-secret-not-used-anywhere-real-32chars
  ENCRYPTION_KEY: ci-only-encryption-key-not-used-anywhere-real-32ch

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx turbo run typecheck

      - name: Lint
        run: npx turbo run lint

      - name: Unit tests
        run: npx turbo run test

      - name: Build
        run: npx turbo run build
